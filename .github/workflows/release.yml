name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:

    - name: Resolve tag
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          tag="${{ inputs.tag }}"
        else
          tag="${GITHUB_REF_NAME}"
        fi
        case "$tag" in
          v[0-9]*) ;;
          *) echo "Tag must look like vX.Y.Z, got: $tag"; exit 1 ;;
        esac
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v6
      with:
        ref: ${{ steps.tag.outputs.tag }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Build wheel and sdist
      run: |
        uv build
        ls -l dist

    - name: Check that the package version matches the tag
      run: |
        version="${{ steps.tag.outputs.version }}"
        test -f "dist/instant_mongo-${version}-py3-none-any.whl"
        test -f "dist/instant_mongo-${version}.tar.gz"

    - name: Smoke test the wheel
      run: |
        python3 -m venv venv-check
        venv-check/bin/pip install dist/instant_mongo-*.whl
        venv-check/bin/python -c '
        import instant_mongo
        assert instant_mongo.__version__ == "${{ steps.tag.outputs.version }}", instant_mongo.__version__
        print("ok:", instant_mongo.__version__)
        '

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: ${{ steps.tag.outputs.tag }}
        generate_release_notes: true
        files: |
          dist/instant_mongo-*.whl
          dist/instant_mongo-*.tar.gz
