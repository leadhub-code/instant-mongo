name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

    - name: Resolve tag
      id: tag
      # Pass the untrusted input through env rather than interpolating it
      # into the script, so it cannot inject shell commands.
      env:
        INPUT_TAG: ${{ inputs.tag }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          tag="$INPUT_TAG"
        else
          tag="$GITHUB_REF_NAME"
        fi
        if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Tag must look like vX.Y.Z, got: $tag"
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v6
      with:
        ref: ${{ steps.tag.outputs.tag }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Build wheel and sdist
      run: |
        uv build
        ls -l dist

    - name: Check that the package version matches the tag
      env:
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        test -f "dist/instant_mongo-${VERSION}-py3-none-any.whl"
        test -f "dist/instant_mongo-${VERSION}.tar.gz"

    - name: Smoke test the wheel
      env:
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        python3 -m venv venv-check
        venv-check/bin/pip install dist/instant_mongo-*.whl
        venv-check/bin/python -c '
        import os, instant_mongo
        assert instant_mongo.__version__ == os.environ["VERSION"], instant_mongo.__version__
        print("ok:", instant_mongo.__version__)
        '

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: ${{ steps.tag.outputs.tag }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          dist/instant_mongo-*.whl
          dist/instant_mongo-*.tar.gz
